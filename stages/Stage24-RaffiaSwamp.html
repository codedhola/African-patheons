<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}</style></head><body>

<div style="position: relative; width: 1600px; height: 900px; overflow: hidden; background: #1a140e; font-family: Andika, 'Noto Sans', 'Segoe UI', system-ui, sans-serif; color: #f4efe6;">

<svg width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Fighting stage: a raised mud bank in a raffia-palm swamp in the blue hour before dawn, when palm-wine tappers go to work. Raffia palms with huge arching fronds stand in still, misty water that reflects the first glow on the horizon. At the centre a tapper hangs in his climbing belt at the top of a tall oil palm beside a small lamp, a gourd catching the sap; another works at the crown of a raffia palm, and a canoe slips along the channel. On the bank stand calabashes and clay pots of palm wine beside a small smoky fire, and dark fronds frame the corners." style="position: absolute; left: 0; top: 0; display: block;">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0e1a36"></stop>
<stop offset="0.55" stop-color="#22405a"></stop>
<stop offset="0.85" stop-color="#5a6a7a"></stop>
<stop offset="1" stop-color="#c89478"></stop>
</linearGradient>
<radialGradient id="dawn" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#f2b488" stop-opacity="0.7"></stop>
<stop offset="1" stop-color="#f2b488" stop-opacity="0"></stop>
</radialGradient>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#6a7a84"></stop>
<stop offset="0.4" stop-color="#2a4a54"></stop>
<stop offset="1" stop-color="#14262e"></stop>
</linearGradient>
<linearGradient id="mud" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#4a3a2c"></stop>
<stop offset="0.5" stop-color="#30261c"></stop>
<stop offset="1" stop-color="#16100a"></stop>
</linearGradient>
<radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#ffc06a" stop-opacity="0.7"></stop>
<stop offset="1" stop-color="#ff9a40" stop-opacity="0"></stop>
</radialGradient>
<pattern id="stars" width="300" height="200" patternUnits="userSpaceOnUse">
<circle cx="30" cy="30" r="1.2" fill="#dfe6ff"></circle><circle cx="140" cy="80" r="1" fill="#dfe6ff"></circle><circle cx="230" cy="20" r="1.3" fill="#ffffff"></circle><circle cx="90" cy="150" r="1" fill="#dfe6ff"></circle><circle cx="260" cy="130" r="1" fill="#dfe6ff"></circle>
</pattern>
<radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
<stop offset="0.55" stop-color="#000000" stop-opacity="0"></stop>
<stop offset="1" stop-color="#04070c" stop-opacity="0.65"></stop>
</radialGradient>
<filter id="mist" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="12"></feGaussianBlur></filter>
<filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>
<filter id="smoke" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"></feGaussianBlur></filter>
<symbol id="raffia" overflow="visible">
<path fill="currentColor" d="M-12 0 C -14 -40, -10 -80, -6 -110 L 8 -110 C 10 -80, 12 -40, 12 0 Z"></path>
<path fill="currentColor" d="M0 -106 C 50 -170, 150 -240, 300 -260 C 160 -224, 70 -160, 4 -96 Z M0 -106 C -50 -170, -150 -240, -300 -260 C -160 -224, -70 -160, -4 -96 Z M0 -108 C 30 -200, 90 -300, 180 -360 C 110 -290, 50 -200, 4 -104 Z M0 -108 C -30 -200, -90 -300, -180 -360 C -110 -290, -50 -200, -4 -104 Z M0 -108 C 4 -220, 20 -320, 40 -400 C 30 -310, 14 -210, 2 -104 Z M0 -104 C 70 -130, 180 -150, 320 -130 C 190 -126, 80 -110, 2 -98 Z M0 -104 C -70 -130, -180 -150, -320 -130 C -190 -126, -80 -110, -2 -98 Z"></path>
</symbol>
<symbol id="oilpalm" overflow="visible">
<path fill="currentColor" d="M-8 0 C -10 -120, -6 -260, 0 -420 L 10 -420 C 8 -260, 10 -120, 10 0 Z"></path>
<path fill="currentColor" d="M4 -420 C -30 -444, -80 -440, -112 -412 C -72 -430, -34 -430, 4 -412 Z M4 -420 C 40 -444, 90 -440, 122 -412 C 82 -430, 44 -430, 4 -412 Z M4 -420 C -18 -460, -56 -480, -96 -480 C -58 -466, -24 -446, 2 -416 Z M4 -420 C 26 -460, 64 -480, 104 -480 C 66 -466, 32 -446, 6 -416 Z M4 -420 C 0 -462, 8 -492, 22 -510 C 16 -480, 12 -450, 6 -418 Z M4 -420 C -32 -410, -60 -380, -70 -340 C -50 -376, -26 -400, 4 -414 Z M4 -420 C 40 -410, 68 -380, 78 -340 C 58 -376, 34 -400, 4 -414 Z"></path>
</symbol>
</defs>

<!-- blue hour sky -->
<rect x="0" y="0" width="1600" height="600" fill="url(#sky)"></rect>
<rect x="0" y="0" width="1600" height="300" fill="url(#stars)" opacity="0.7"></rect>
<ellipse cx="320" cy="560" rx="520" ry="200" fill="url(#dawn)"></ellipse>

<!-- far raffia palms in the mist -->
<use href="#raffia" transform="translate(120 560) scale(0.45)" style="color: #3e5e6a"></use>
<use href="#raffia" transform="translate(420 556) scale(0.4)" style="color: #3e5e6a"></use>

<path d="M0 560 C 200 548, 400 552, 600 546 C 800 540, 1000 550, 1200 544 C 1400 538, 1500 546, 1600 542 L 1600 580 L 0 580 Z" fill="#2e4c56"></path>

<!-- swamp water -->

<g fill="#f2c8a8" opacity="0.6">
<rect x="250" y="578" width="140" height="3" rx="1.5"></rect><rect x="220" y="594" width="200" height="3" rx="1.5"></rect><rect x="270" y="612" width="110" height="3" rx="1.5"></rect><rect x="200" y="634" width="240" height="3" rx="1.5"></rect>

<use href="#oilpalm" transform="translate(770 700)" style="color: #142428"></use>
<ellipse cx="778" cy="300" rx="110" ry="90" fill="url(#lamp)"></ellipse>
<g stroke="#08100f" stroke-width="2" stroke-linejoin="round">
<ellipse cx="788" cy="318" rx="34" ry="11" fill="none" stroke="#6a4a2a" stroke-width="3.5"></ellipse>
<circle cx="818" cy="288" r="9" fill="#142428"></circle>
<path d="M810 298 L 828 298 L 830 336 L 814 340 Z" fill="#142428"></path>
<path d="M812 304 L 790 296 M814 314 L 790 312" fill="none" stroke="#142428" stroke-width="5" stroke-linecap="round"></path>
<path d="M816 338 L 790 356 M826 338 L 794 372" fill="none" stroke="#142428" stroke-width="5" stroke-linecap="round"></path>
<path d="M764 296 C 756 318, 772 330, 784 320 C 790 310, 784 298, 772 296 Z" fill="#9a7a44"></path>
</g>
<path d="M776 288 L 776 296" stroke="#6a4a2a" stroke-width="2"></path>
<g filter="url(#glow)">
<path d="M846 284 C 840 292, 840 300, 846 304 C 852 300, 852 292, 846 284 Z" fill="#ffc06a"></path>
</g>
<path d="M838 306 L 854 306 L 852 312 L 840 312 Z" fill="#5a3a20"></path>

<!-- a canoe slipping along the channel -->
<g fill="#0e1a1e">
<path d="M1080 656 C 1130 666, 1220 666, 1260 654 C 1246 666, 1210 672, 1170 672 C 1130 672, 1096 668, 1080 656 Z"></path>
<circle cx="1176" cy="624" r="7"></circle>
<path d="M1168 632 L 1184 632 L 1186 656 L 1166 656 Z"></path>

<path d="M1090 676 C 1140 684, 1220 684, 1256 674" fill="none" stroke="#9ab8c0" stroke-width="2" opacity="0.5"></path>

<path d="M0 702 C 200 694, 420 706, 640 698 C 860 690, 1080 704, 1300 696 C 1440 692, 1540 698, 1600 694" fill="none" stroke="#7a8a90" stroke-width="2.5" opacity="0.6"></path>
<g opacity="0.85">
<ellipse cx="560" cy="770" rx="110" ry="12" fill="#3a5a64"></ellipse>

</g>
<g fill="none" stroke="#c8a088" stroke-width="2" stroke-linecap="round" opacity="0.5">
<path d="M520 768 L 600 768"></path><path d="M930 828 L 1030 828"></path>
</g>
<g fill="none" stroke="#120c08" stroke-width="6" stroke-linecap="round">

<!-- calabashes and clay pots of palm wine -->
<g stroke="#0a0604" stroke-width="2" stroke-linejoin="round">

<ellipse cx="1240" cy="744" rx="12" ry="4" fill="#4a2414"></ellipse>

<circle cx="1326" cy="780" r="12" fill="#a87a3e"></circle>
<path d="M1326 768 L 1326 758" stroke="#6a4a24" stroke-width="3"></path>
<path d="M1352 788 C 1352 800, 1386 800, 1386 788 Z" fill="#c89a5a"></path>
<ellipse cx="1369" cy="788" rx="17" ry="4" fill="#f2ead6"></ellipse>
</g>
<g fill="none" stroke="#6a4a2a" stroke-width="3">
<ellipse cx="1430" cy="790" rx="26" ry="8"></ellipse>
<ellipse cx="1430" cy="786" rx="18" ry="5"></ellipse>
</g>
<!-- small smoky fire -->
<ellipse cx="320" cy="770" rx="110" ry="40" fill="url(#lamp)"></ellipse>
<g stroke="#0a0604" stroke-width="2.5" stroke-linejoin="round">
<path d="M282 784 L 352 770 L 356 780 L 286 794 Z" fill="#3a2414"></path>
<path d="M288 770 L 356 784 L 352 794 L 284 780 Z" fill="#2a1a0c"></path>
</g>
<g filter="url(#glow)">
<path d="M320 778 C 304 768, 302 750, 314 736 C 316 748, 322 752, 324 744 C 326 754, 334 758, 332 768 C 330 776, 326 780, 320 778 Z" fill="#ff8a2a"></path>
<path d="M320 776 C 312 770, 312 760, 318 752 C 320 760, 324 762, 326 758 C 328 766, 326 772, 320 776 Z" fill="#ffd06a"></path>
</g>
<g fill="#8a98a8" opacity="0.35" filter="url(#smoke)">
<circle cx="326" cy="716" r="16"></circle><circle cx="340" cy="676" r="22"></circle><circle cx="330" cy="630" r="26"></circle>
</g>

<!-- dark fronds framing the corners -->
<use href="#raffia" transform="translate(-40 300) scale(1.1) rotate(20)" style="color: #08100f"></use>
<use href="#raffia" transform="translate(1660 340) scale(1.15) rotate(-24)" style="color: #08100f"></use>
<g fill="#0a1412" stroke="#030606" stroke-width="2" stroke-linejoin="round">
<path d="M1500 900 C 1504 820, 1510 740, 1526 660 L 1560 660 C 1554 740, 1556 820, 1570 900 Z"></path>

<rect x="0" y="0" width="1600" height="900" fill="url(#vig)"></rect>
</svg>



</div>
